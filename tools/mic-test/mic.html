<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Prueba de micrófono (Melochi)</title>
  </head>
  <body style="font: 15px 'Segoe UI', sans-serif; padding: 16px">
    <div id="s">Abriendo el micrófono…</div>
    <script>
      navigator.mediaDevices
        .getUserMedia({ audio: true })
        .then(() => (document.getElementById('s').textContent = 'Micrófono en uso (no se graba nada). Se cierra solo.'))
        .catch((e) => (document.getElementById('s').textContent = 'Error: ' + e.message));
    </script>
  </body>
</html>
